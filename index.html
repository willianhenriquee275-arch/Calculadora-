<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <style>
    :root {
      --bg: #121417;
      --panel: #1c2026;
      --btn: #272c35;
      --btn-hover: #323844;
      --op: #2f5d8a;
      --op-hover: #3a72a8;
      --accent: #2e8b57;
      --accent-hover: #38a668;
      --danger: #8b3a3a;
      --danger-hover: #a64646;
      --text: #f3f5f7;
      --muted: #9aa3b2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .calculator {
      width: 100%;
      max-width: 340px;
      background: var(--panel);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .display {
      background: #121417;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
      text-align: right;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      word-break: break-all;
    }

    .history {
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    .current {
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 56px;
      border: none;
      border-radius: 10px;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--text);
      background: var(--btn);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.06s ease;
    }

    button:hover {
      background: var(--btn-hover);
    }

    button:active {
      transform: scale(0.97);
    }

    button.op {
      background: var(--op);
    }

    button.op:hover {
      background: var(--op-hover);
    }

    button.clear {
      background: var(--danger);
    }

    button.clear:hover {
      background: var(--danger-hover);
    }

    button.equals {
      background: var(--accent);
      grid-column: span 2;
    }

    button.equals:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculadora">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button type="button" class="clear" data-action="clear">C</button>
      <button type="button" data-action="backspace">⌫</button>
      <button type="button" class="op" data-action="percent">%</button>
      <button type="button" class="op" data-op="/">÷</button>

      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" class="op" data-op="*">×</button>

      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" class="op" data-op="-">−</button>

      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" class="op" data-op="+">+</button>

      <button type="button" data-digit="0">0</button>
      <button type="button" data-action="decimal">.</button>
      <button type="button" class="equals" data-action="equals">=</button>
    </div>
  </main>

  <script>
    const historyEl = document.getElementById("history");
    const currentEl = document.getElementById("current");

    let current = "0";
    let previous = null;
    let operator = null;
    let overwrite = false;

    const symbols = { "/": "÷", "*": "×", "-": "−", "+": "+" };

    function updateDisplay() {
      currentEl.textContent = current;
      historyEl.textContent =
        previous !== null && operator ? `${previous} ${symbols[operator]}` : "";
    }

    function inputDigit(digit) {
      if (current === "Erro" || overwrite) {
        current = digit;
        overwrite = false;
        return;
      }
      current = current === "0" ? digit : current + digit;
    }

    function inputDecimal() {
      if (current === "Erro" || overwrite) {
        current = "0.";
        overwrite = false;
        return;
      }
      if (!current.includes(".")) {
        current += ".";
      }
    }

    function calculate() {
      if (previous === null || operator === null) return;
      const a = parseFloat(previous);
      const b = parseFloat(current);
      if (Number.isNaN(a) || Number.isNaN(b)) return;

      let result;
      switch (operator) {
        case "+":
          result = a + b;
          break;
        case "-":
          result = a - b;
          break;
        case "*":
          result = a * b;
          break;
        case "/":
          if (b === 0) {
            current = "Erro";
            previous = null;
            operator = null;
            overwrite = true;
            return;
          }
          result = a / b;
          break;
      }

      // Evita imprecisão de ponto flutuante como 0.30000000000000004
      current = String(Math.round(result * 1e12) / 1e12);
      previous = null;
      operator = null;
      overwrite = true;
    }

    function chooseOperator(nextOp) {
      if (current === "Erro") return;
      if (previous !== null && operator && !overwrite) {
        calculate();
        if (current === "Erro") return;
      }
      previous = current;
      operator = nextOp;
      overwrite = true;
    }

    function clearAll() {
      current = "0";
      previous = null;
      operator = null;
      overwrite = false;
    }

    function backspace() {
      if (current === "Erro" || overwrite) {
        clearAll();
        return;
      }
      current = current.length > 1 ? current.slice(0, -1) : "0";
    }

    function percent() {
      if (current === "Erro") return;
      const val = parseFloat(current);
      if (Number.isNaN(val)) return;
      current = String(Math.round((val / 100) * 1e12) / 1e12);
      overwrite = true;
    }

    document.querySelector(".keys").addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      if (btn.dataset.digit) inputDigit(btn.dataset.digit);
      else if (btn.dataset.op) chooseOperator(btn.dataset.op);
      else {
        switch (btn.dataset.action) {
          case "decimal":
            inputDecimal();
            break;
          case "equals":
            calculate();
            break;
          case "clear":
            clearAll();
            break;
          case "backspace":
            backspace();
            break;
          case "percent":
            percent();
            break;
        }
      }
      updateDisplay();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") inputDigit(e.key);
      else if (["+", "-", "*", "/"].includes(e.key)) chooseOperator(e.key);
      else if (e.key === "." || e.key === ",") inputDecimal();
      else if (e.key === "Enter" || e.key === "=") {
        e.preventDefault();
        calculate();
      } else if (e.key === "Backspace") backspace();
      else if (e.key === "Escape") clearAll();
      else if (e.key === "%") percent();
      else return;
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
